[theme]
base = "light"
primaryColor = "#059669"
backgroundColor = "#f7f9fc"
secondaryBackgroundColor = "#ffffff"
textColor = "#172b4d"
font = "sans-serif"
paddingTop = "1.5rem"
headingFontSizes = ["2rem", "1.6rem", "1.2rem", "1rem", "1rem", "1rem"]
baseRadius = "large"
buttonRadius = "large"
showWidgetBorder = true
showSidebarBorder = true
[theme.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#ecfdf5"
[server]
maxUploadSize = 20

